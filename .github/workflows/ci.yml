name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ViennaRNA
        run: |
          sudo apt-get update
          sudo apt-get install -y vienna-rna

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webapp/requirements.txt

      - name: Run tests
        run: |
          cd webapp && python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: splicing-model:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run -d --name test-container -p 8000:8000 splicing-model:${{ github.sha }}
          # Wait for the app to be ready (model loading takes time)
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/health; then
              echo "Health check passed"
              docker stop test-container
              exit 0
            fi
            echo "Waiting for app to be ready... ($i/30)"
            sleep 5
          done
          echo "Health check failed after 150s"
          docker logs test-container
          docker stop test-container
          exit 1
